<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juntablanca</title>
<style>
  @media (prefers-reduced-motion: no-preference) {
    body { animation: fade-in 0.6s ease-out; }
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FAFAF8;
    color: #1A1A18;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }

  main {
    text-align: center;
    padding: 2rem;
  }

  h1 {
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 500;
    letter-spacing: -0.02em;
    margin-bottom: 0.75rem;
  }

  p {
    font-size: 1.05rem;
    color: #6B6B66;
    max-width: 32ch;
    margin: 0 auto;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <main>
    <h1>Juntablanca</h1>
    <p>El dominio está conectado. La web llega pronto.</p>
  </main>
</body>
</html>
